[project]
name = "open-source-assist"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "fastembed>=0.8.0",
    "httpx>=0.28.1",
    "email-validator>=2.2.0",
    "bcrypt>=4.0.1,<5.0.0",
    "aiosqlite>=0.21.0",
    "aiosmtplib>=5.0.0",
    "alembic>=1.16.5",
    "asyncpg>=0.30.0",
    "langchain",
    "langchain-community",
    "langchain-google-genai",
    "langgraph",
    "litellm",
    "passlib[bcrypt]>=1.7.4",
    "pydantic-settings>=2.15.0",
    "python-jose[cryptography]>=3.5.0",
    "qdrant-client>=1.19.1",
    "sqlalchemy",
    "uvicorn[standard]>=0.53.0",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"

